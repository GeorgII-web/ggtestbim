[package]
name = "ggtestbim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"

# Dev builds: optimize dependencies (Bevy is slow unoptimized) and the game code too (world generation and
# collision run every frame); debug info and overflow checks stay for the game code.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
