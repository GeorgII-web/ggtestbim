[package]
name = "ggtestbim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"

# Fast dev builds: optimize dependencies (Bevy is slow unoptimized), keep own code debuggable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
